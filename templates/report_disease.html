{% extends 'base.html' %}

{% block title %}Report New Disease - EpiShield{% endblock %}

{% block content %}
    <div class="container mt-4">
        <h2 class="text-center text-success mb-4">Report New Disease</h2>

        <!-- Report Disease Form -->
        <div class="card shadow-sm p-4">
            <h4 class="card-title text-center">Disease Information</h4>
            <form method="POST" action="{{ url_for('report_disease') }}">
                <div class="mb-3">
                    <label for="disease_name" class="form-label">Disease Name</label>
                    <input type="text" class="form-control" id="disease_name" name="disease_name" required placeholder="e.g., Influenza">
                </div>
                <div class="mb-3">
                    <label for="symptoms" class="form-label">Symptoms</label>
                    <textarea class="form-control" id="symptoms" name="symptoms" rows="3" required placeholder="e.g., Fever, cough, fatigue"></textarea>
                </div>
                <div class="mb-3">
                    <label for="mortality_rate" class="form-label">Mortality Rate (%)</label>
                    <input type="number" step="0.01" class="form-control" id="mortality_rate" name="mortality_rate" min="0" max="100" required placeholder="e.g., 2.50">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success">Report Disease</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
