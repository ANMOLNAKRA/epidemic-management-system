<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EpiShield</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Bradley Hand ITC', sans-serif;
            min-height: 100vh;
            background: orange;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        .login-container {
            display: flex;
            max-width: 900px;
            width: 100%;
            min-height: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            animation: slideIn 1s ease-in-out;
        }
        .login-left {
            flex: 1;
            background: linear-gradient(135deg, rgba(40, 167, 69, 0.9), rgba(33, 136, 56, 0.9));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: white;
            position: relative;
        }
        .login-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/45-degree-fabric-light.png');
            opacity: 0.2;
        }
        .login-left h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        .login-left i {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        .login-left p {
            font-size: 1rem;
            opacity: 0.9;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .login-right {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-right h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #28a745;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-floating {
            margin-bottom: 20px;
            position: relative;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #ced4da;
            padding-left: 40px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.2);
        }
        .form-floating i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #28a745;
            font-size: 1.1rem;
        }
        .btn-custom {
            background: linear-gradient(to right, #28a745, #218838);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 10px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            width: 100%;
        }
        .btn-custom:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        .error {
            color: #dc3545;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid #f5c6cb;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .register-link a {
            color: #28a745;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 400px;
                min-height: auto;
            }
            .login-left {
                padding: 20px;
                min-height: 200px;
            }
            .login-left h1 { font-size: 2rem; }
            .login-left i { font-size: 3rem; }
            .login-right { padding: 30px; }
            .login-right h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Side: Branding -->
        <div class="login-left">
            <i class="fas fa-shield-alt"></i>
            <h1>EpiShield</h1>
            <p>Protecting Communities, One Step at a Time</p>
        </div>
        <!-- Right Side: Login Form -->
        <div class="login-right">
            <h2>Sign In</h2>
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
            <form method="POST">
                <div class="form-floating">
           
                    <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                    <label for="username">Username</label>
                </div>
                <div class="form-floating">
                    
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <button type="submit" class="btn btn-custom">Login</button>
            </form>
            <div class="register-link">
                <p>Don't have an account? <a href="{{ url_for('index') }}">Register here</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
