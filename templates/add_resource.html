{% extends 'base.html' %}

{% block title %}Add Resource - EpiShield{% endblock %}

{% block content %}
    <div class="container mt-4">
        <h2 class="text-center text-success mb-4">Add New Resource</h2>

        <!-- Add Resource Form -->
        <div class="card shadow-sm p-4">
            <h4 class="card-title text-center">Resource Information</h4>
            <form method="POST" action="{{ url_for('add_resource') }}">
                <div class="mb-3">
                    <label for="type" class="form-label">Resource Type</label>
                    <input type="text" class="form-control" id="type" name="type" required placeholder="e.g., Ventilator, PPE Kits">
                </div>
                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" min="1" required placeholder="Enter total quantity">
                </div>
                <div class="mb-3">
                    <label for="allocated" class="form-label">Allocated (Optional)</label>
                    <input type="number" class="form-control" id="allocated" name="allocated" min="0" value="0" placeholder="Enter allocated quantity">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success">Add Resource</button>
                    <a href="{{ url_for('view_resources') }}" class="btn btn-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
